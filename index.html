<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1117" />
  <title>Koner Monitoring</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d1117; --surface: #161b22; --surface2: #1c2330;
      --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.14);
      --text: #e6edf3; --text2: #8b949e; --text3: #484f58;
      --koner: #8B5CF6; --koner-soft: rgba(139,92,246,0.12); --koner-glow: rgba(139,92,246,0.25);
    }
    html, body {
      background: var(--bg); color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh; min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: ""; position: fixed; inset: 0;
      pointer-events: none; z-index: 0; opacity: 0.3;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.15'/%3E%3C/svg%3E");
    }
    .hidden { display: none !important; }

    /* LOADING */
    #loadingOverlay {
      position: fixed; inset: 0; z-index: 9000; background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 14px;
    }
    .spinner {
      width: 32px; height: 32px;
      border: 2.5px solid rgba(255,255,255,0.08);
      border-top-color: var(--koner); border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 13px; color: var(--text3); font-family: 'DM Mono', monospace; }

    /* LOGIN */
    #loginScreen {
      position: fixed; inset: 0; z-index: 100; background: var(--bg);
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 32px;
    }
    .login-logo { width: 52px; height: 52px; object-fit: contain; margin-bottom: 36px; }
    .login-heading {
      font-size: clamp(28px, 7vw, 42px); font-weight: 800;
      letter-spacing: -0.03em; line-height: 1.1;
      color: var(--text); text-align: center; margin-bottom: 8px;
    }
    .login-heading span { color: var(--koner); }
    .login-sub {
      font-family: 'DM Mono', monospace; font-size: 12px;
      color: var(--text3); margin-bottom: 48px; text-align: center;
    }
    .login-btn {
      display: flex; align-items: center; gap: 12px;
      background: var(--surface); color: var(--text);
      padding: 14px 28px; border-radius: 999px;
      font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 600;
      border: 1px solid var(--border2); cursor: pointer;
      transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
    }
    .login-btn:hover { border-color: rgba(139,92,246,0.5); transform: translateY(-2px); box-shadow: 0 8px 28px rgba(0,0,0,0.3); }
    .login-btn:active { transform: translateY(0); }
    .login-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
    .login-error {
      margin-top: 20px; padding: 12px 20px;
      background: rgba(248,81,73,0.1); border: 1px solid rgba(248,81,73,0.3);
      border-radius: 10px; font-size: 13px; color: #f85149;
      max-width: 340px; text-align: center; line-height: 1.5;
    }
    .login-footer {
      position: absolute; bottom: calc(28px + env(safe-area-inset-bottom, 0));
      font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--text3); font-family: 'DM Mono', monospace;
    }

    /* APP SHELL */
    .wrap { max-width: 760px; margin: 0 auto; padding: 0 24px 80px; position: relative; z-index: 1; }

    /* TOPBAR */
    .topbar { display: flex; align-items: center; justify-content: flex-end; padding: 16px 0 0; }
    .avatar-btn {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--koner-soft); border: 1px solid rgba(139,92,246,0.3);
      color: var(--koner); font-family: 'Syne', sans-serif;
      font-size: 13px; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }
    .avatar-btn:hover { background: rgba(139,92,246,0.2); }

    /* HEADER */
    .header { padding: 36px 0 0; margin-bottom: 48px; }
    .back-link {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 12px; font-weight: 600; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--text3);
      text-decoration: none; margin-bottom: 36px; transition: color 0.15s;
    }
    .back-link:hover { color: var(--text2); }
    .back-link svg { width: 14px; height: 14px; }
    .logo-row { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
    .koner-badge {
      display: inline-flex; align-items: center; justify-content: center;
      width: 48px; height: 48px; border-radius: 12px;
      background: var(--koner-soft); border: 1px solid rgba(139,92,246,0.3); flex-shrink: 0;
    }
    .koner-badge img { width: 28px; height: 28px; object-fit: contain; display: block; }
    .page-title { font-size: clamp(28px, 6vw, 42px); font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; color: var(--text); }
    .page-title span { color: var(--koner); }
    .page-sub { font-size: 14px; color: var(--text2); margin-top: 8px; font-family: 'DM Mono', monospace; }
    .divider { height: 1px; background: linear-gradient(to right, rgba(139,92,246,0.4), transparent); margin-top: 32px; }

    /* SECTION LABEL */
    .section-label {
      font-size: 11px; font-weight: 600; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--text3); margin-bottom: 20px;
      display: flex; align-items: center; gap: 10px;
    }
    .section-label::after { content: ""; flex: 1; height: 1px; background: var(--border); }

    /* GRID */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
    .project-card {
      display: block; text-decoration: none;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 20px 20px 18px;
      transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
      position: relative; overflow: hidden;
      opacity: 0; animation: fadeUp 0.4s ease forwards;
    }
    .project-card:hover { border-color: rgba(139,92,246,0.45); transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0,0,0,0.3), 0 0 0 1px rgba(139,92,246,0.2); }
    .project-card:active { transform: translateY(0); }
    .project-card::before {
      content: ""; position: absolute; inset: 0;
      background: radial-gradient(circle at 50% 0%, var(--koner-glow), transparent 70%);
      opacity: 0; transition: opacity 0.3s; pointer-events: none;
    }
    .project-card:hover::before { opacity: 1; }
    .project-card:nth-child(1) { animation-delay: 0.04s; }
    .project-card:nth-child(2) { animation-delay: 0.09s; }
    .project-card:nth-child(3) { animation-delay: 0.14s; }
    .project-card:nth-child(4) { animation-delay: 0.19s; }
    .project-card:nth-child(5) { animation-delay: 0.24s; }
    .project-card:nth-child(6) { animation-delay: 0.29s; }
    .project-card:nth-child(7) { animation-delay: 0.34s; }
    .project-card:nth-child(8) { animation-delay: 0.39s; }
    .project-card:nth-child(9) { animation-delay: 0.44s; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 14px; }
    .card-icon { width: 38px; height: 38px; border-radius: 9px; background: var(--surface2); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; }
    .card-icon svg { width: 18px; height: 18px; color: var(--koner); }
    .card-arrow { color: var(--text3); transition: color 0.15s, transform 0.15s; }
    .project-card:hover .card-arrow { color: var(--koner); transform: translate(2px, -2px); }
    .card-slug { font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text3); margin-bottom: 5px; }
    .card-name { font-size: 15px; font-weight: 700; color: var(--text); line-height: 1.3; letter-spacing: -0.01em; }

    /* FOOTER */
    .footer { margin-top: 56px; padding-top: 24px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
    .footer-brand { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text3); }
    .footer-version { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text3); }

    /* MODAL */
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 500;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
      display: flex; align-items: flex-end; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .modal-backdrop.open { opacity: 1; pointer-events: all; }
    .modal {
      background: var(--surface); border: 1px solid var(--border2);
      border-radius: 20px 20px 0 0; width: 100%; max-width: 480px;
      padding: 16px 24px calc(28px + env(safe-area-inset-bottom, 0));
      transform: translateY(20px); transition: transform 0.2s; position: relative;
    }
    .modal-backdrop.open .modal { transform: translateY(0); }
    .modal-handle { width: 36px; height: 4px; border-radius: 2px; background: var(--border2); margin: 0 auto 20px; }
    .modal-close { position: absolute; top: 16px; right: 20px; background: none; border: none; color: var(--text3); font-size: 18px; cursor: pointer; padding: 4px; }
    .modal-title { font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text3); margin-bottom: 20px; }
    .user-info-block { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
    .user-info-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--koner-soft); border: 1px solid rgba(139,92,246,0.3); color: var(--koner); font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .user-info-name { font-size: 15px; font-weight: 700; color: var(--text); }
    .user-info-email { font-size: 12px; color: var(--text3); font-family: 'DM Mono', monospace; margin-top: 2px; }
    .menu-item { width: 100%; padding: 14px 16px; border-radius: 10px; background: var(--surface2); border: 1px solid var(--border); color: var(--text); font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; text-align: left; transition: background 0.15s; }
    .menu-item.danger { color: #f85149; }
    .menu-item.danger:hover { background: rgba(248,81,73,0.08); border-color: rgba(248,81,73,0.2); }

    @media (max-width: 500px) {
      .wrap { padding: 0 16px 60px; }
      .header { padding-top: 24px; margin-bottom: 36px; }
      .grid { grid-template-columns: 1fr 1fr; gap: 10px; }
      .project-card { padding: 16px 14px 14px; }
    }
  </style>
</head>
<body>

<div id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text">memuat...</div>
</div>

<div id="loginScreen" class="hidden">
  <img src="logo-koner.png" alt="Koner" class="login-logo" />
  <h1 class="login-heading">Koner <span>Monitoring</span></h1>
  <p class="login-sub">monitoring.koner.co.id</p>
  <button class="login-btn" id="loginBtn">
    <svg viewBox="0 0 24 24" fill="none">
      <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
      <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
      <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
      <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
    </svg>
    Masuk dengan Google
  </button>
  <div id="loginError" class="login-error hidden"></div>
  <div class="login-footer">PT Arjuna Solusi Sejahtera</div>
</div>

<div id="appShell" class="hidden">
  <div class="wrap">
    <div class="topbar">
      <button class="avatar-btn" id="avatarBtn" aria-label="Akun saya">
        <span id="avatarInitials">?</span>
      </button>
    </div>
    <header class="header">
      <a class="back-link" href="https://apps.arjunasolusi.co.id">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        Arjuna Apps Hub
      </a>
      <div class="logo-row">
        <div class="koner-badge">
          <img src="logo-koner.png" alt="Koner" />
        </div>
        <div>
          <h1 class="page-title">Koner <span>Monitoring</span></h1>
        </div>
      </div>
      <p class="page-sub">monitoring.koner.co.id — IoT dashboard per project</p>
      <div class="divider"></div>
    </header>
    <main>
      <p class="section-label">Project Sites</p>
      <div class="grid" id="projectGrid"></div>
    </main>
    <footer class="footer">
      <span class="footer-brand">Koner — PT Arjuna Solusi Sejahtera</span>
      <span class="footer-version">v1.0</span>
    </footer>
  </div>
</div>

<div class="modal-backdrop" id="userModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <button class="modal-close" id="modalClose">&#x2715;</button>
    <div class="modal-title">Akun</div>
    <div class="user-info-block">
      <div class="user-info-avatar" id="menuAvatar">?</div>
      <div>
        <div class="user-info-name" id="menuName">-</div>
        <div class="user-info-email" id="menuEmail">-</div>
      </div>
    </div>
    <button class="menu-item danger" id="signOutBtn">Log out</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBGogHg2NJYhpta0BnItwHKAwdGWX85gjA",
    authDomain: "arjuna-fireball.firebaseapp.com",
    projectId: "arjuna-fireball",
    storageBucket: "arjuna-fireball.firebasestorage.app",
    messagingSenderId: "81903876062",
    appId: "1:81903876062:web:a030f6630e436e6b9a4f4f"
  };

  const PROJECTS = [
    { slug: "heated-dryer-koner",     name: "Heated Dryer Koner",     href: "/heated-dryer-koner/" },
    { slug: "project-fima",           name: "Project Fima",           href: "/project-fima/" },
    { slug: "project-goodyearbb1",    name: "Goodyear BB1",           href: "/project-goodyearbb1_/" },
    { slug: "project-goodyearbb3",    name: "Goodyear BB3",           href: "/project-goodyearbb3_/" },
    { slug: "project-kalbe",          name: "Kalbe",                  href: "/project-kalbe/" },
    { slug: "project-kalbe-2",        name: "Kalbe 2",                href: "/project-kalbe-2/" },
    { slug: "projectbeta",            name: "Project Beta",           href: "/projectbeta/" },
    { slug: "pt-arjuna-solusi",       name: "PT Arjuna Solusi",       href: "/pt-arjuna-solusi/" },
    { slug: "pt-arjuna-solusi-25011", name: "PT Arjuna Solusi 25011", href: "/pt-arjuna-solusi-25011/" },
  ];

  const fbApp = initializeApp(firebaseConfig);
  const auth  = getAuth(fbApp);
  const db    = getFirestore(fbApp);
  const provider = new GoogleAuthProvider();
  const $ = id => document.getElementById(id);

  function initials(name) {
    if (!name) return "?";
    const p = name.trim().split(/\s+/);
    return ((p[0]?.[0] || "") + (p[1]?.[0] || "")).toUpperCase();
  }
  function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      $("loadingOverlay").classList.add("hidden");
      $("loginScreen").classList.remove("hidden");
      return;
    }
    try {
      const snap = await getDoc(doc(db, "whitelist", user.email));
      if (!snap.exists()) {
        await signOut(auth);
        showErr("Email " + esc(user.email) + " tidak terdaftar. Hubungi admin.");
        $("loadingOverlay").classList.add("hidden");
        $("loginScreen").classList.remove("hidden");
        return;
      }
      const wl   = snap.data();
      const name = wl.name || user.displayName || user.email;
      $("avatarInitials").textContent = initials(name);
      $("menuAvatar").textContent     = initials(name);
      $("menuName").textContent       = name;
      $("menuEmail").textContent      = user.email;
      renderGrid();
      $("loadingOverlay").classList.add("hidden");
      $("loginScreen").classList.add("hidden");
      $("appShell").classList.remove("hidden");
    } catch (err) {
      console.error(err);
      showErr("Terjadi kesalahan. Coba lagi.");
      $("loadingOverlay").classList.add("hidden");
      $("loginScreen").classList.remove("hidden");
    }
  });

  function renderGrid() {
    const grid = $("projectGrid");
    grid.innerHTML = "";
    PROJECTS.forEach(p => {
      const a = document.createElement("a");
      a.className = "project-card";
      a.href = p.href;
      a.innerHTML =
        '<div class="card-top">' +
          '<div class="card-icon">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>' +
          '</div>' +
          '<svg class="card-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>' +
        '</div>' +
        '<div class="card-slug">' + esc(p.slug) + '</div>' +
        '<div class="card-name">' + esc(p.name) + '</div>';
      grid.appendChild(a);
    });
  }

  $("loginBtn").addEventListener("click", async () => {
    hideErr();
    try { await signInWithPopup(auth, provider); }
    catch (err) { if (err.code !== "auth/popup-closed-by-user") showErr("Gagal masuk. Coba lagi."); }
  });

  $("signOutBtn").addEventListener("click", async () => { closeModal(); await signOut(auth); });
  $("avatarBtn").addEventListener("click", openModal);
  $("modalClose").addEventListener("click", closeModal);
  $("userModal").addEventListener("click", e => { if (e.target === $("userModal")) closeModal(); });

  function openModal()  { $("userModal").classList.add("open");    document.body.style.overflow = "hidden"; }
  function closeModal() { $("userModal").classList.remove("open"); document.body.style.overflow = ""; }
  function showErr(msg) { const e = $("loginError"); e.textContent = msg; e.classList.remove("hidden"); }
  function hideErr()    { $("loginError").classList.add("hidden"); }
</script>

</body>
</html>
