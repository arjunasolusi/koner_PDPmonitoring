<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1117" />
  <title>Koner Monitoring</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d1117;
      --surface:   #161b22;
      --surface2:  #1c2330;
      --border:    rgba(255,255,255,0.08);
      --border2:   rgba(255,255,255,0.14);
      --text:      #e6edf3;
      --text2:     #8b949e;
      --text3:     #484f58;
      --accent:    #58a6ff;
      --accent2:   #1f6feb;
      --green:     #3fb950;
      --green-soft:#122a19;
      --koner:     #8B5CF6;
      --koner-soft:rgba(139,92,246,0.12);
      --koner-glow:rgba(139,92,246,0.25);
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
    }

    /* grain overlay */
    body::before {
      content: "";
      position: fixed; inset: 0;
      pointer-events: none; z-index: 0;
      opacity: 0.3;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.15'/%3E%3C/svg%3E");
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 24px 80px;
      position: relative; z-index: 1;
    }

    /* ── HEADER ── */
    .header {
      padding: 52px 0 0;
      margin-bottom: 48px;
    }

    .back-link {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 12px; font-weight: 600; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--text3);
      text-decoration: none; margin-bottom: 36px;
      transition: color 0.15s;
    }
    .back-link:hover { color: var(--text2); }
    .back-link svg { width: 14px; height: 14px; }

    .logo-row {
      display: flex; align-items: center; gap: 16px;
      margin-bottom: 16px;
    }
    .koner-badge {
      display: inline-flex; align-items: center; justify-content: center;
      width: 48px; height: 48px; border-radius: 12px;
      background: var(--koner-soft);
      border: 1px solid rgba(139,92,246,0.3);
      flex-shrink: 0;
    }
    .koner-badge img { width: 28px; height: 28px; object-fit: contain; display: block; }

    .page-title {
      font-size: clamp(28px, 6vw, 42px);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
      color: var(--text);
    }
    .page-title span { color: var(--koner); }

    .page-sub {
      font-size: 14px; font-weight: 400;
      color: var(--text2); margin-top: 8px;
      font-family: 'DM Mono', monospace;
      letter-spacing: 0.01em;
    }

    .divider {
      height: 1px;
      background: linear-gradient(to right, rgba(139,92,246,0.4), transparent);
      margin-top: 32px;
    }

    /* ── SECTION LABEL ── */
    .section-label {
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--text3); margin-bottom: 20px;
      display: flex; align-items: center; gap: 10px;
    }
    .section-label::after {
      content: ""; flex: 1; height: 1px;
      background: var(--border);
    }

    /* ── PROJECT GRID ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
    }

    .project-card {
      display: block; text-decoration: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px 20px 18px;
      transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
      position: relative; overflow: hidden;
      opacity: 0;
      animation: fadeUp 0.4s ease forwards;
    }
    .project-card:hover {
      border-color: rgba(139,92,246,0.45);
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3), 0 0 0 1px rgba(139,92,246,0.2);
    }
    .project-card:active { transform: translateY(0); }

    /* subtle glow on hover */
    .project-card::before {
      content: "";
      position: absolute; inset: 0;
      background: radial-gradient(circle at 50% 0%, var(--koner-glow), transparent 70%);
      opacity: 0; transition: opacity 0.3s ease;
      pointer-events: none;
    }
    .project-card:hover::before { opacity: 1; }

    /* staggered animation */
    .project-card:nth-child(1)  { animation-delay: 0.04s; }
    .project-card:nth-child(2)  { animation-delay: 0.09s; }
    .project-card:nth-child(3)  { animation-delay: 0.14s; }
    .project-card:nth-child(4)  { animation-delay: 0.19s; }
    .project-card:nth-child(5)  { animation-delay: 0.24s; }
    .project-card:nth-child(6)  { animation-delay: 0.29s; }
    .project-card:nth-child(7)  { animation-delay: 0.34s; }
    .project-card:nth-child(8)  { animation-delay: 0.39s; }
    .project-card:nth-child(9)  { animation-delay: 0.44s; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-top {
      display: flex; align-items: flex-start;
      justify-content: space-between; margin-bottom: 14px;
    }
    .card-icon {
      width: 38px; height: 38px; border-radius: 9px;
      background: var(--surface2);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .card-icon svg { width: 18px; height: 18px; color: var(--koner); }

    .card-arrow {
      color: var(--text3); transition: color 0.15s, transform 0.15s;
    }
    .project-card:hover .card-arrow { color: var(--koner); transform: translate(2px, -2px); }

    .card-slug {
      font-family: 'DM Mono', monospace;
      font-size: 10px; font-weight: 500;
      letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--text3); margin-bottom: 5px;
    }
    .card-name {
      font-size: 15px; font-weight: 700;
      color: var(--text); line-height: 1.3;
      letter-spacing: -0.01em;
    }

    /* ── FOOTER ── */
    .footer {
      margin-top: 56px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 8px;
    }
    .footer-brand {
      font-size: 12px; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--text3);
    }
    .footer-version {
      font-family: 'DM Mono', monospace;
      font-size: 11px; color: var(--text3);
    }

    @media (max-width: 500px) {
      .wrap { padding: 0 16px 60px; }
      .header { padding-top: 36px; margin-bottom: 36px; }
      .grid { grid-template-columns: 1fr 1fr; gap: 10px; }
      .project-card { padding: 16px 14px 14px; }
    }
  </style>
</head>
<body>
<div class="wrap">

  <header class="header">
    <a class="back-link" href="https://apps.arjunasolusi.co.id">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
      Arjuna Apps Hub
    </a>
    <div class="logo-row">
      <div class="koner-badge">
        <img src="logo-koner.png" alt="Koner" />
      </div>
      <div>
        <h1 class="page-title">Koner <span>Monitoring</span></h1>
      </div>
    </div>
    <p class="page-sub">monitoring.koner.co.id — IoT dashboard per project</p>
    <div class="divider"></div>
  </header>

  <main>
    <p class="section-label">Project Sites</p>
    <div class="grid" id="projectGrid"></div>
  </main>

  <footer class="footer">
    <span class="footer-brand">Koner — PT Arjuna Solusi Sejahtera</span>
    <span class="footer-version">v1.0</span>
  </footer>

</div>

<script>
  const PROJECTS = [
    { slug: "heated-dryer-koner",    name: "Heated Dryer Koner",    href: "/heated-dryer-koner/" },
    { slug: "project-fima",          name: "Project Fima",          href: "/project-fima/" },
    { slug: "project-goodyearbb1",   name: "Goodyear BB1",          href: "/project-goodyearbb1/" },
    { slug: "project-goodyearbb3",   name: "Goodyear BB3",          href: "/project-goodyearbb3/" },
    { slug: "project-kalbe",         name: "Kalbe",                 href: "/project-kalbe/" },
    { slug: "project-kalbe-2",       name: "Kalbe 2",               href: "/project-kalbe-2/" },
    { slug: "projectbeta",           name: "Project Beta",          href: "/projectbeta/" },
    { slug: "pt-arjuna-solusi",      name: "PT Arjuna Solusi",      href: "/pt-arjuna-solusi/" },
    { slug: "pt-arjuna-solusi-25011",name: "PT Arjuna Solusi 25011",href: "/pt-arjuna-solusi-25011/" },
  ];

  const grid = document.getElementById("projectGrid");

  PROJECTS.forEach(p => {
    const a = document.createElement("a");
    a.className = "project-card";
    a.href = p.href;
    a.innerHTML = `
      <div class="card-top">
        <div class="card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>
          </svg>
        </div>
        <svg class="card-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/>
        </svg>
      </div>
      <div class="card-slug">${p.slug}</div>
      <div class="card-name">${p.name}</div>
    `;
    grid.appendChild(a);
  });
</script>
</body>
</html>
