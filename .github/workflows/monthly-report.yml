name: Monthly Report

on:
  schedule:
    - cron: '0 1 1 * *'  # Setiap tanggal 1 jam 08:00 WIB (1:00 UTC)
  workflow_dispatch:

jobs:
  send_report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq

      - name: Fetch data from Firebase
        run: |
          START_DATE=$(date -u -d "$(date +%Y-%m-01) -1 month" +%s)
          END_DATE=$(date -u -d "$(date +%Y-%m-01)" +%s)
          echo "Unix start: $START_DATE"
          echo "Unix end: $END_DATE"

          URL="https://koner-dewpoint-default-rtdb.asia-southeast1.firebasedatabase.app/device1.json"
          response=$(curl -s "$URL")

          if [ "$response" == "null" ]; then
            echo "No data found in Firebase. Exiting..."
            exit 0
          fi

          echo "$response" | jq -r --argjson start $((START_DATE * 1000)) --argjson end $((END_DATE * 1000)) '
            to_entries
            | map(select(.value.timestamp != null and .value.timestamp >= $start and .value.timestamp < $end))
            | map(.value)
            | (["timestamp","value"] | @csv), (.[] | [.timestamp, .value] | @csv)
          ' > monthly.csv

          echo "CSV content preview:"
          head monthly.csv

      - name: Send email with attachment
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Koner Dewpoint Monthly Report"
          to: ${{ secrets.EMAIL_RECIPIENT }}
          from: ${{ secrets.EMAIL_FROM }}
          body: |
            Berikut terlampir laporan dewpoint bulanan dari sistem monitoring Koner.
            Jika ada pertanyaan atau perlu laporan tambahan, silakan hubungi tim teknis.
          attachments: monthly.csv
