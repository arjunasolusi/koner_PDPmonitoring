name: Firebase Cleanup

on:
  schedule:
    - cron: '0 1 * * *' # Daily at 1:00 AM UTC
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete logs older than 90 days based on key names
        run: |
          echo "Starting safe cleanup..."

          URL="https://koner-dewpoint-default-rtdb.asia-southeast1.firebasedatabase.app/device1.json"
          response=$(curl -s "$URL")

          now=$(date +%s)
          cutoff=$((now - 7776000))  # 90 days in seconds

          echo "$response" | jq -r 'keys[]' |
          while read -r key; do
            # Convert ISO 8601 key to Unix timestamp
            key_time=$(date -d "$key" +%s || echo 0)

            if [ "$key_time" -lt "$cutoff" ]; then
              echo "Deleting: $key"
              curl -s -X DELETE "https://koner-dewpoint-default-rtdb.asia-southeast1.firebasedatabase.app/device1/$(echo $key | sed 's/+/%2B/g').json"
            fi
          done

          echo "Cleanup complete."
