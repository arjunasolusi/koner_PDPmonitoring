<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Koner Dewpoint Monitor</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background-color: #fff;
      color: #000;
      font-family: sans-serif;
      text-align: center;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
      box-sizing: border-box;
      overflow-x: hidden;
    }

    canvas {
      max-width: 100%;
      height: 300px !important;
      display: block;
      margin: 0 auto;
    }

    .buttons {
      margin-top: 20px;
    }

    .buttons button {
      margin: 5px;
      padding: 10px 20px;
      font-size: 14px;
      cursor: pointer;
    }

    .live-section {
      margin-bottom: 20px;
    }

    .live-label {
      font-size: 18px;
      font-weight: bold;
    }

    .live-value {
      font-size: 42px;
      margin: 5px 0;
    }

    .live-range {
      font-size: 14px;
      color: #b7b7b7;
    }

    .timestamp {
      margin-top: 5px;
      font-size: 12px;
      color: #999;
    }

    .logo {
      max-width: 150px;
      margin-bottom: 10px;
    }
    .sub-title {
      color: #001f3f;    /* NAVY */
      font-size: 20px;
      font-weight: 600;
      margin-top: -5px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="Logo Koner hitam.png" alt="Logo" class="logo" />
    <h1>IoT Dewpoint Monitoring</h1>
    <div class="sub-title">PT KALBE FARMA Tbk</div>

    <div class="live-section">
      <div class="live-label">Live Dewpoint:</div>
      <div class="live-value" id="live-value">--</div>
      <div class="live-range">Range -100 ... +20°Ctd</div>
      <div class="timestamp" id="last-updated">Last updated: --</div>
    </div>

    <canvas id="trend-chart"></canvas>

    <div class="buttons">
      <button id="download-all">Download All Data</button>
      <button id="download-3d">Download Last 3 Days</button>
      <button id="download-24h">Download Last 24 Hours</button>
    </div>
  </div>

  <script type="module">
    const PASSCODE = "kalbe";
    const input = prompt("PASSCODE");
    if (input !== PASSCODE) {
      document.body.innerHTML = "<h1>Akses ditolak</h1>";
      throw new Error("Unauthorized");
    }
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getDatabase,
      ref,
      onValue,
      get
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AlzaSyCAHinoIlJVr2vsyGkcLFB7KQVIPZhUtos",
      authDomain: "koner-dewpoint.firebaseapp.com",
      databaseURL: "https://koner-dewpoint-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "koner-dewpoint"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const rootRef = ref(db, "/koner25012");

    const liveValue = document.getElementById("live-value");
    const lastUpdated = document.getElementById("last-updated");
    const downloadAllBtn = document.getElementById("download-all");
    const download3DaysBtn = document.getElementById("download-3d");
    const download24hBtn = document.getElementById("download-24h");

    const chart = new Chart(document.getElementById("trend-chart").getContext("2d"), {
      type: "line",
      data: {
        labels: [],
        datasets: [{
          label: "Dewpoint (°Ctd)",
          data: [],
          borderColor: "#3F47CD",
          borderWidth: 2,
          tension: 0.2,
          pointRadius: 0
        }]
      },
      options: {
        scales: {
          x: {
            ticks: { color: "#aaa" },
            grid: { color: "#fff" }
          },
          y: {
            min: -100,
            max: 20,
            ticks: { color: "#aaa" },
            grid: { color: "#ddd" }
          }
        },
        plugins: {
          legend: { labels: { color: "#ccc" } }
        }
      }
    });

    onValue(rootRef, snapshot => {
      const data = snapshot.val();
      if (!data) return;

      const entries = Object.entries(data).sort(([a], [b]) => new Date(a) - new Date(b));
      const now = Date.now();
      const cutoff = now - 20 * 60 * 1000; // 20 minutes

      const filtered = entries.filter(([ts]) => new Date(ts).getTime() >= cutoff);

      const labels = filtered.map(([ts]) => {
        const local = new Date(ts);
        return local.toLocaleTimeString("id-ID", {
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit"
        });
      });

      const values = filtered.map(([, v]) => v.value);

      if (labels.length > 0) {
        chart.data.labels = labels;
        chart.data.datasets[0].data = values;
        chart.update();

        const lastLocal = new Date(filtered[filtered.length - 1][0]);
        liveValue.textContent = values[values.length - 1].toFixed(2);
        lastUpdated.textContent = `Last updated: ${lastLocal.toLocaleString("id-ID")}`;
      }
    });

    downloadAllBtn.onclick = async () => {
      const snapshot = await get(rootRef);
      const data = snapshot.val();
      if (!data) return alert("No data to download");

      downloadCSV(data, "all_data.csv");
    };

    download3DaysBtn.onclick = async () => {
      const snapshot = await get(rootRef);
      const data = snapshot.val();
      if (!data) return alert("No data to download");

      const now = Date.now();
      const cutoff = now - 3 * 24 * 60 * 60 * 1000;
      const filtered = Object.fromEntries(
        Object.entries(data).filter(([ts]) => new Date(ts).getTime() >= cutoff)
      );

      downloadCSV(filtered, "last_3_days.csv");
    };

    download24hBtn.onclick = async () => {
      const snapshot = await get(rootRef);
      const data = snapshot.val();
      if (!data) return alert("No data to download");

      const now = Date.now();
      const cutoff = now - 24 * 60 * 60 * 1000;
      const filtered = Object.fromEntries(
        Object.entries(data).filter(([ts]) => new Date(ts).getTime() >= cutoff)
      );

      downloadCSV(filtered, "last_24_hours.csv");
    };

    function downloadCSV(data, filename) {
      const rows = [["Timestamp", "Value"]];
      Object.entries(data).forEach(([ts, { value }]) => {
        rows.push([ts, value]);
      });

      const csv = rows.map(row => row.join(",")).join("\n");
      const blob = new Blob([csv], { type: "text/csv" });
      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.click();
    }
  </script>

  <footer>
    <p style="text-align:center; font-size: 0.85em; color: gray; line-height: 1.6;">
      © 2025 Koner. All rights reserved.<br>
      Customer Service – PT Arjuna Solusi Sejahtera<br>
      Tel: (021) 22524347 · Email: <a href="mailto:sales@arjunasolusi.co.id" style="color:gray; text-decoration:underline;">sales@arjunasolusi.co.id</a>
    </p>
  </footer>
</body>
</html>
