<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Koner Dewpoint Monitor</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
  body{background:#fff;color:#000;font-family:sans-serif;text-align:center;}
  .container{max-width:900px;margin:0 auto;padding:20px;box-sizing:border-box;}
  .logo{max-width:150px;margin-bottom:10px;}
  h1{margin:10px 0 6px 0;}
  .sub-title{color:#3F47CD;font-size:20px;font-weight:600;margin:0 0 18px 0;}

  /* accordion */
  .accordion{border:1px solid #eaeaea;border-radius:10px;overflow:hidden;margin:14px 0;text-align:left;}
  .accordion-header{
    width:100%;display:flex;justify-content:space-between;align-items:center;
    padding:14px 16px;background:#fafafa;border:none;cursor:pointer;font-size:18px;font-weight:700;
  }
  .accordion-header:focus{outline:none;}
  .chev{transition:.15s;}
  .accordion.open .chev{transform:rotate(180deg);}
  .accordion-body{display:none;padding:14px 16px 16px;border-top:1px solid #eee;text-align:center;}
  .accordion.open .accordion-body{display:block;}

  .live-section{margin-bottom:6px;}
  .live-label{font-size:16px;font-weight:bold;}
  .live-value{font-size:42px;margin:0;}
  .live-range{font-size:14px;color:#b7b7b7;margin-top:6px;}
  .timestamp{margin-top:5px;font-size:12px;color:#999;}

  /* chart sizing (anti-squish) */
  .chart-wrap{width:100%;height:360px;margin:10px auto 0 auto;}
  .chart-wrap canvas{width:100% !important;height:100% !important;display:block;}

  .buttons{margin-top:14px;}
  .buttons button{margin:5px;padding:10px 16px;font-size:14px;cursor:pointer;}
  footer{margin-top:24px;}
</style>
</head>

<body>
<div class="container">

  <img src="Logo Koner hitam.png" class="logo" alt="Koner"/>
  <h1>IoT Dewpoint Monitoring</h1>
  <div class="sub-title">PT KALBE FARMA Tbk</div>

  <!-- DRYER 2 -->
  <div class="accordion" id="acc-d2">
    <button class="accordion-header" type="button" data-target="acc-d2" data-dryer="d2">
      <span>Dryer 2</span><span class="chev">⌄</span>
    </button>

    <div class="accordion-body">
      <div class="live-section">
        <div class="live-label">Live Dewpoint:</div>
        <div class="live-value" id="live-value-d2">--</div>
        <div class="live-range">Range -100 ... +20°Ctd</div>
        <div class="timestamp" id="last-updated-d2">Last updated: --</div>
      </div>

      <div class="chart-wrap">
        <canvas id="trend-chart-d2"></canvas>
      </div>

      <div class="buttons">
        <button id="download-all-d2" type="button">Download All Data</button>
        <button id="download-3d-d2" type="button">Download Last 3 Days</button>
        <button id="download-24h-d2" type="button">Download Last 24 Hours</button>
      </div>
    </div>
  </div>

  <!-- DRYER 5 -->
  <div class="accordion" id="acc-d5">
    <button class="accordion-header" type="button" data-target="acc-d5" data-dryer="d5">
      <span>Dryer 5</span><span class="chev">⌄</span>
    </button>

    <div class="accordion-body">
      <div class="live-section">
        <div class="live-label">Live Dewpoint:</div>
        <div class="live-value" id="live-value-d5">--</div>
        <div class="live-range">Range -100 ... +20°Ctd</div>
        <div class="timestamp" id="last-updated-d5">Last updated: --</div>
      </div>

      <div class="chart-wrap">
        <canvas id="trend-chart-d5"></canvas>
      </div>

      <div class="buttons">
        <button id="download-all-d5" type="button">Download All Data</button>
        <button id="download-3d-d5" type="button">Download Last 3 Days</button>
        <button id="download-24h-d5" type="button">Download Last 24 Hours</button>
      </div>
    </div>
  </div>

  <footer>
    <p style="font-size:0.85em;color:gray;line-height:1.6;">
      © 2025 Koner. All rights reserved.<br>
      Customer Service – PT Arjuna Solusi Sejahtera<br>
      Tel: (021) 22524347 · Email:
      <a href="mailto:sales@arjunasolusi.co.id" style="color:gray;text-decoration:underline;">sales@arjunasolusi.co.id</a>
    </p>
  </footer>

</div>

<script type="module">
  // ===== PASSCODE =====
  const PASSCODE = "kalbe";
  if (prompt("PASSCODE") !== PASSCODE) {
    document.body.innerHTML = "<h1>Akses ditolak</h1>";
    throw new Error("Unauthorized");
  }

  // ===== FIREBASE =====
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, onValue, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AlzaSyCAHinoIlJVr2vsyGkcLFB7KQVIPZhUtos",
    authDomain: "koner-dewpoint.firebaseapp.com",
    databaseURL: "https://koner-dewpoint-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "koner-dewpoint"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // ===== PATHS (UBAH DI SINI) =====
  const PATHS = {
    d2: "/koner25012",
    d5: "/koner25015"
  };

  // ===== CSV =====
  function downloadCSV(data, filename) {
    const rows = [["Timestamp", "Value"]];
    Object.entries(data).forEach(([ts, obj]) => {
      const v = (obj && typeof obj === "object" && "value" in obj) ? obj.value : obj;
      rows.push([ts, v]);
    });

    const csv = rows.map(r => r.join(",")).join("\n");
    const blob = new Blob([csv], { type: "text/csv" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.click();
  }

  // ===== CHART =====
  function makeChart(canvasId) {
    return new Chart(document.getElementById(canvasId).getContext("2d"), {
      type: "line",
      data: {
        labels: [],
        datasets: [{
          label: "Dewpoint (°Ctd)",
          data: [],
          borderColor: "#3F47CD",
          borderWidth: 2,
          tension: 0.2,
          pointRadius: 0
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: { y: { min: -100, max: 20 } }
      }
    });
  }

  // ===== LAZY INIT (agar chart tidak hilang) =====
  const state = { d2: { inited:false, chart:null }, d5: { inited:false, chart:null } };

  function initDryer(key) {
    if (state[key].inited) return;

    const rootRef = ref(db, PATHS[key]);
    const chart = makeChart(`trend-chart-${key}`);
    state[key].chart = chart;

    const liveEl = document.getElementById(`live-value-${key}`);
    const timeEl = document.getElementById(`last-updated-${key}`);

    onValue(rootRef, snap => {
      const data = snap.val();
      if (!data) return;

      const entries = Object.entries(data).sort(([a],[b]) => new Date(a) - new Date(b));
      const now = Date.now();
      const cutoff = now - 20 * 60 * 1000;

      const filtered = entries.filter(([ts]) => new Date(ts).getTime() >= cutoff);
      const labels = filtered.map(([ts]) => new Date(ts).toLocaleTimeString("id-ID", { hour:"2-digit", minute:"2-digit", second:"2-digit" }));
      const values = filtered.map(([,v]) => (v && typeof v === "object" && "value" in v) ? v.value : v);

      if (!labels.length) return;

      chart.data.labels = labels;
      chart.data.datasets[0].data = values;
      chart.update();

      liveEl.textContent = Number(values.at(-1)).toFixed(2);
      timeEl.textContent = "Last updated: " + new Date(filtered.at(-1)[0]).toLocaleString("id-ID");
    });

    state[key].inited = true;

    setTimeout(() => { chart.resize(); chart.update(); }, 50);
  }

  // ===== DOWNLOAD BUTTONS (FIX) =====
  async function fetchData(key) {
    const rootRef = ref(db, PATHS[key]);
    const snap = await get(rootRef);
    const data = snap.val();
    if (!data) {
      alert("No data to download");
      return null;
    }
    return data;
  }

  function wireDownloads(key, prefix) {
    const btnAll = document.getElementById(`download-all-${key}`);
    const btn3d  = document.getElementById(`download-3d-${key}`);
    const btn24h = document.getElementById(`download-24h-${key}`);

    btnAll.onclick = async () => {
      const data = await fetchData(key);
      if (!data) return;
      downloadCSV(data, `${prefix}_all_data.csv`);
    };

    btn3d.onclick = async () => {
      const data = await fetchData(key);
      if (!data) return;

      const now = Date.now();
      const cutoff = now - 3 * 24 * 60 * 60 * 1000;
      const filtered = Object.fromEntries(
        Object.entries(data).filter(([ts]) => new Date(ts).getTime() >= cutoff)
      );

      downloadCSV(filtered, `${prefix}_last_3_days.csv`);
    };

    btn24h.onclick = async () => {
      const data = await fetchData(key);
      if (!data) return;

      const now = Date.now();
      const cutoff = now - 24 * 60 * 60 * 1000;
      const filtered = Object.fromEntries(
        Object.entries(data).filter(([ts]) => new Date(ts).getTime() >= cutoff)
      );

      downloadCSV(filtered, `${prefix}_last_24_hours.csv`);
    };
  }

  wireDownloads("d2", "dryer2");
  wireDownloads("d5", "dryer5");

  // ===== ACCORDION TOGGLE =====
  function toggleAccordion(id, dryerKey) {
    const el = document.getElementById(id);
    const willOpen = !el.classList.contains("open");
    el.classList.toggle("open", willOpen);

    if (willOpen) {
      initDryer(dryerKey);
      setTimeout(() => {
        const ch = state[dryerKey].chart;
        if (ch) { ch.resize(); ch.update(); }
      }, 50);
    }
  }

  document.querySelectorAll(".accordion-header").forEach(btn => {
    btn.addEventListener("click", () => toggleAccordion(btn.dataset.target, btn.dataset.dryer));
  });

  // auto open Dryer 2
  toggleAccordion("acc-d2", "d2");
</script>
</body>
</html>
