<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Koner Heated Dryer — Live</title>
  <style>
    :root {
      --c-press: #2563eb;  /* B1/B2 */
      --c-press2:#60a5fa;  /* B2 */
      --c-temp:  #16a34a;  /* R1/R2 */
      --c-temp2: #22c55e;  /* R2 */
      --c-dew:   #ef4444;  /* dew   */
      --border:  #e5e7eb;
      --muted:   #6b7280;
    }
    body { font-family: system-ui, Arial, sans-serif; margin: 24px; color:#111; background:#fff; }
    h1 { margin: 0 0 16px; }
    .grid { display: grid; grid-template-columns: repeat(3,minmax(220px,1fr)); gap: 16px; }
    .card { border: 1px solid var(--border); border-radius: 12px; padding: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
    .label { color: var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.05em; }
    .value { font-size:28px; font-weight:700; margin-top:6px; }
    .ts    { margin-top:12px; color:#9ca3af; font-size:12px; }
    .chart-wrap { margin-top: 10px; height: 420px; }
    canvas { width: 100% !important; height: 100% !important; background:#fff; border:1px solid var(--border); border-radius:12px; padding:8px; display:block; }
  </style>

  <!-- Chart.js + date adapter -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>

  <!-- Firebase (modular SDK) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    // ---- Firebase config (yours) ----
    const firebaseConfig = {
      apiKey: "AIzaSyCAHinoIlJVr2vsyGkCLFB7KQVlPzhUtos",
      authDomain: "koner-dewpoint.firebaseapp.com",
      databaseURL: "https://koner-dewpoint-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "koner-dewpoint"
    };
    // ----------------------------------

    // Constants
    const deviceId = "heateddryer";
    const TAGS   = ["B1","B2","R1","R2","dew"];
    const COLORS = { B1:"#2563eb", B2:"#60a5fa", R1:"#16a34a", R2:"#22c55e", dew:"#ef4444" };
    const TAG_AXIS = { B1:"pressure", B2:"pressure", R1:"temp", R2:"temp", dew:"dew" };

    // Init
    const app = initializeApp(firebaseConfig);
    const db  = getDatabase(app);

    // --- UI skeleton ---
    const root = document.body;
    root.insertAdjacentHTML("beforeend", `
      <h1>Heated Dryer — Live</h1>
      <div class="grid">
        <div class="card"><div class="label">Pressure A (B1)</div><div id="B1" class="value">—</div></div>
        <div class="card"><div class="label">Pressure B (B2)</div><div id="B2" class="value">—</div></div>
        <div class="card"><div class="label">Dew Point</div><div id="dew" class="value">—</div></div>
        <div class="card"><div class="label">Temperature 1 (R1)</div><div id="R1" class="value">—</div></div>
        <div class="card"><div class="label">Temperature 2 (R2)</div><div id="R2" class="value">—</div></div>
        <div class="card"><div class="label">Sequence</div><div id="seq" class="value">—</div></div>
      </div>
      <p class="ts" id="last">Last updated: —</p>

      <div class="chart-wrap"><canvas id="trend"></canvas></div>
    `);

    // ========== Latest tiles ==========
    const el = Object.fromEntries([...TAGS, "seq", "last"].map(id => [id, document.getElementById(id)]));
    function setVal(id, val, unit){ el[id].textContent = (val==null || !isFinite(Number(val))) ? "—" : `${val}${unit}`; }
    async function refreshLatest(){
      const snap = await get(ref(db, `/${deviceId}/latest`));
      if (!snap.exists()) return;
      const v = snap.val();
      setVal("B1", v.B1, " bar"); setVal("B2", v.B2, " bar");
      setVal("R1", v.R1, " °C");  setVal("R2", v.R2, " °C");
      setVal("dew", v.dew, " °C dp"); setVal("seq", v.seq ?? "—", "");
      const ts = toMs(v.ts); el.last.textContent = "Last updated: " + (ts ? new Date(ts).toLocaleString() : "—");
    }
    refreshLatest(); setInterval(refreshLatest, 15000);

    // ========== Chart (3 Y-axes, 24h window) ==========
    const ctx = document.getElementById("trend").getContext("2d");
    const datasets = TAGS.map(t => ({
      label: t,
      borderColor: COLORS[t],
      backgroundColor: COLORS[t],
      data: [],
      borderWidth: 2,
      tension: .2,
      // show a dot when only 1 point exists
      pointRadius: ctx => (ctx.dataset.data && ctx.dataset.data.length < 2 ? 3 : 0),
      pointHoverRadius: 4,
      yAxisID: TAG_AXIS[t]
    }));

    const chart = new Chart(ctx, {
      type: "line",
      data: { datasets },
      options: {
        parsing: false,
        animation: false,
        normalized: true,
        maintainAspectRatio: false, // respect 420px container
        interaction: { mode: "nearest", intersect: false },
        plugins: {
          // Legend visible but non-clickable
          legend: {
            display: true,
            position: "top",
            onClick: () => {} // disable toggle
          },
          decimation: { enabled: true, algorithm: "lttb" }
        },
        scales: {
          x: { type: "time", time: { unit: "minute" } },
          y: { display: false }, // dummy

          pressure: {
            type: "linear", position: "left", offset: true,
            suggestedMin: 0, suggestedMax: 16,
            title: { display: true, text: "Pressure (bar)" },
            ticks: { color: "#2563eb" },
            grid: { color: "rgba(0,0,0,0.06)" }
          },
          temp: {
            type: "linear", position: "left", offset: true,
            suggestedMin: 0, suggestedMax: 200,
            title: { display: true, text: "Temperature (°C)" },
            ticks: { color: "#16a34a" },
            grid: { drawOnChartArea: false }
          },
          dew: {
            type: "linear", position: "left", offset: true,
            suggestedMin: -100, suggestedMax: 20,
            title: { display: true, text: "Dew Point (°C)" },
            ticks: { color: "#ef4444" },
            grid: { drawOnChartArea: false }
          }
        }
      }
    });
    // expose for quick debug if needed
    window.chart = chart;

    // Initial + periodic refresh (5m)
    await loadRange24h();
    setInterval(() => {
      const m = new Date().getMinutes();
      if ([0,5,10,15,20,25,30,35,40,45,50,55].includes(m) && new Date().getSeconds() < 5) {
        loadRange24h();
      }
    }, 4000);
    window.loadRange24h = loadRange24h;

    async function loadRange24h(){
      const end   = Date.now();
      const start = end - 24*60*60*1000;
      // lock the x window so a few points always render clearly
      chart.options.scales.x.min = start;
      chart.options.scales.x.max = end;

      const days = daysBetween(new Date(start), new Date(end));
      const series = Object.fromEntries(TAGS.map(t => [t, []]));

      for (const tag of TAGS) {
        for (const [Y,M,D] of days) {
          const p = `/${deviceId}/streams/${tag}/m5/${Y}/${M}/${D}`;
          const daySnap = await get(ref(db, p));
          if (!daySnap.exists()) continue;
          for (const rec of Object.values(daySnap.val())) {
            const tsMs = toMs(rec.ts);
            const val  = Number(rec.val ?? rec[tag]);
            if (isFinite(tsMs) && isFinite(val) && tsMs >= start && tsMs <= end) {
              series[tag].push({ x: tsMs, y: val }); // use epoch ms for x
            }
          }
        }
        series[tag].sort((a,b)=>a.x - b.x);
      }
      chart.data.datasets.forEach(ds => ds.data = series[ds.label]);
      chart.update();
    }

    // helpers
    function daysBetween(start, end){
      const out = [];
      const d = new Date(start.getFullYear(), start.getMonth(), start.getDate());
      while (d <= end) {
        out.push([ String(d.getFullYear()), pad(d.getMonth()+1), pad(d.getDate()) ]);
        d.setDate(d.getDate()+1);
      }
      return out;
    }
    function pad(n){ return String(n).padStart(2,"0"); }
    function toMs(ts){
      if (ts == null) return NaN;
      if (typeof ts === "number") return ts < 2e10 ? ts*1000 : ts; // seconds → ms
      if (typeof ts === "string") return new Date(ts).getTime();
      return NaN;
    }
  </script>
</head>
<body></body>
</html>
